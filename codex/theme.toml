# One Dark Pro Darker for the Codex desktop app.
# These values go into ~/.codex/config.toml; run apply.py to merge them safely.

[desktop]
appearanceDarkCodeThemeId = "one"

[desktop.appearanceDarkChromeTheme]
accent = "#4d78cc"
accentSource = "custom"
contrast = 60
ink = "#abb2bf"
opaqueWindows = false
surface = "#23272e"

[desktop.appearanceDarkChromeTheme.fonts]
code = '"Cascadia Mono", "Microsoft YaHei Mono", Consolas'

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#98c379"
diffRemoved = "#e06c75"
skill = "#c162de"
