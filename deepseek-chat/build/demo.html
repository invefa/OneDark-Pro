<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>One Dark Pro Darker for DeepSeek Chat</title>
<!-- 真实的 DeepSeek 样式表，用来验证皮肤覆盖在其之上 -->
<link rel="stylesheet" href="https://fe-static.deepseek.com/chat/static/main.1e9681a4d3.css">
<style>
  html, body { margin: 0; height: 100%; }
  .demo { max-width: 820px; margin: 0 auto; padding: 28px 24px 40px; }
  .demo-meta { margin-bottom: 18px; }
  .code-wrap { border: 1px solid var(--dsw-alias-border-l2); border-radius: 4px; overflow: hidden; margin: 18px 0; }
  .code-banner { padding: 8px 14px; font-size: 12px; color: var(--dsw-alias-label-tertiary);
                 background: var(--dsw-alias-markdown-code-block-banner); border-bottom: 1px solid var(--dsw-alias-border-l1); }
  .md-code-block { margin: 0; padding: 14px 16px; font: 13px/1.65 var(--ds-font-family-code, Consolas, monospace);
                   white-space: pre; overflow: auto; }
</style>
</head>
<body data-ds-dark-theme>
<div class="demo">
  <div class="demo-meta">
    <div class="ds-markdown">
      <h3>One Dark Pro Darker 效果预览</h3>
      <p>正文使用主题前景色，包含 <strong>加粗</strong>、<em>斜体</em>、<a href="#">链接</a> 与 <code>inline_code()</code>。</p>
      <ul>
        <li>列表项一</li>
        <li>列表项二</li>
      </ul>
    </div>
  </div>

  <div class="code-wrap">
    <div class="code-banner">javascript</div>
<pre class="md-code-block md-code-block-dark"><code class="language-javascript"><span class="token comment">// 主题色依次对应关键字、函数、字符串、数字、注释</span>
<span class="token keyword">const</span> <span class="token function">render</span><span class="token punctuation">(</span><span class="token parameter">items</span><span class="token punctuation">)</span> <span class="token operator">=</span><span class="token operator">&gt;</span> <span class="token punctuation">{</span>
  <span class="token keyword">return</span> <span class="token variable">items</span><span class="token punctuation">.</span><span class="token property">map</span><span class="token punctuation">(</span><span class="token parameter">item</span> <span class="token operator">=&gt;</span> <span class="token string">"hi"</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
<span class="token punctuation">}</span><span class="token punctuation">;</span>

<span class="token keyword">class</span> <span class="token class-name">Widget</span> <span class="token punctuation">{</span>
  <span class="token function">constructor</span><span class="token punctuation">(</span><span class="token parameter">size</span><span class="token punctuation">)</span> <span class="token punctuation">{</span>
    <span class="token keyword">this</span><span class="token punctuation">.</span><span class="token property">size</span> <span class="token operator">=</span> <span class="token number">42</span><span class="token punctuation">;</span>
    <span class="token builtin">console</span><span class="token punctuation">.</span><span class="token function">log</span><span class="token punctuation">(</span><span class="token string">"ok"</span><span class="token punctuation">,</span> <span class="token constant">true</span><span class="token punctuation">)</span><span class="token punctuation">;</span>
  <span class="token punctuation">}</span>
<span class="token punctuation">}</span></code></pre>
  </div>

  <div class="ds-markdown">
    <blockquote><p>引用一段内容</p></blockquote>
  </div>
</div>
</body>
</html>
